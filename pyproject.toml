[project]
name = "paratera-cli"
version = "0.1.0"
description = "Personal Python client for the Paratera API"
requires-python = ">=3.11"
dependencies = ["httpx2==2.13.1"]

[project.scripts]
paratera = "paratera_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paratera_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.pyrefly]
preset = "basic"
project-includes = ["src", "tests", "scripts"]
search-path = ["src"]
